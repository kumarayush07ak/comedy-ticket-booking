name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comedy_ticket
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d comedy_ticket"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/comedy_ticket
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key
          CORS_ORIGINS: http://localhost:5173
          SMTP_HOST: localhost
          SMTP_PORT: 587
          SMTP_USERNAME: ci-test@example.com
          SMTP_PASSWORD: ci-test-password
          SMTP_FROM_EMAIL: ci-test@example.com
          FRONTEND_BASE_URL: http://localhost:5173
          EMAIL_VERIFICATION_EXPIRE_MINUTES: 30
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/comedy_ticket
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key
          CORS_ORIGINS: http://localhost:5173
          SMTP_HOST: localhost
          SMTP_PORT: 587
          SMTP_USERNAME: ci-test@example.com
          SMTP_PASSWORD: ci-test-password
          SMTP_FROM_EMAIL: ci-test@example.com
          FRONTEND_BASE_URL: http://localhost:5173
          EMAIL_VERIFICATION_EXPIRE_MINUTES: 30
        run: pytest -v